server:
  port: 8081
spring:
  application:
    name: DiffHawk

  datasource:
    url: jdbc:mysql://localhost:3306/diffhawk
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email

jwt:
  secret: ${JWT_SECRET}
  expiry-ms: 86400000
app:
  webhook-url: http://localhost:8081/webhooks/github
logging:
  level:
    org.flywaydb: DEBUG